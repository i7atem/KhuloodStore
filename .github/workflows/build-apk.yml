
name: Build Khulood Store APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip project
        run: |
          unzip -o KhuloodStore_Modern_Project.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Build APK
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found in project ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLE_FILE")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KhuloodStore-APK
          path: project/**/build/outputs/apk/**/*.apk
